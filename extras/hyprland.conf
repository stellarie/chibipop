# chibipop on bare Hyprland (no uwsm): include this from hyprland.conf
# with
#
#     source = ~/.config/hypr/chibipop.conf
#
# after copying it there. Under uwsm the settings window's Autostart
# checkbox (XDG autostart) is the better route - use one, not both.
#
# Syntax below is Hyprland <= 0.55's config language; later versions may
# rename directives - check `hyprctl version` against the wiki if a line
# is rejected.

# Start the daemon with the compositor.
exec-once = chibipop run

# Native trigger binds: press runs trigger-down, release trigger-up -
# exactly the verbs the control socket speaks. This mirrors the default
# ALT+F chord; the settings window shows (and copies) the snippet for
# whatever chord you configure there.
#
# What the pair does: trigger-down takes one frozen grab of the monitor
# under the cursor, before the popup exists, and every lookup while the
# chord is held reads that grab - so the popup can sit on top of the
# word it is defining and the next lookup still reads through it.
# trigger-up drops the grab and hides the popup.
#
# One Hyprland defect to know about (verified in Hyprland 0.55.4 source
# and live): if you release the modifier BEFORE the key - ALT up, then F
# up - Hyprland fires no release bind at all. Release matching requires
# the bind's modifiers to still be held at the instant of the release,
# and a bind on the modifier's own release stops matching the moment any
# other key was pressed during the hold (hyprwm/Hyprland#5032, #7675).
# No bind arrangement works around it - the trigger-up is simply lost
# and the popup sticks, following the cursor as if the chord were still
# held. Hence the comment lines below, which the settings window ships
# as part of the snippet. The toggle bind further down never has this
# problem (it needs no release), and neither does the GlobalShortcuts
# portal route (launch chibipop from its desktop entry or the systemd
# unit and bind `global, chibipop:trigger` instead - Hyprland delivers
# portal releases keyed to the pressed shortcut, not the mod mask).
bind = ALT, F, exec, chibipop ctl trigger-down
bindr = ALT, F, exec, chibipop ctl trigger-up
# Release F before ALT - Hyprland drops modifier-first releases (hyprwm/Hyprland#5032).
# If the popup sticks, tap the chord again (release F first), or bind `ctl toggle` instead.

# Bare-modifier hold (hold Shift to read), the Windows default's
# equivalent. Hyprland can bind a modifier as the key itself, which is
# what makes this one line rather than a submap: name the modifier in
# both the mask and the key.
#
# Cost of this one, and why it is not the default: while bound, every
# Shift press and release spawns a `chibipop ctl` process, and Shift is
# not a chord you can avoid pressing. Prefer it on a reading machine,
# not a typing one. (Bare modifiers are also impossible on the portal
# shortcuts channel - KDE/GNOME - which is why ALT+F is the
# default.) Same wedge family as above: pressing any other key while
# Shift is held shadows the release bind (hyprwm/Hyprland#5032), so the
# hold sticks until the next clean Shift tap.
#
# bind  = SHIFT, Shift_L, exec, chibipop ctl trigger-down
# bindr = SHIFT, Shift_L, exec, chibipop ctl trigger-up

# Add the word in the popup to Anki. Use the control socket even when XDPH
# registers `anki-add`. The portal namespace depends on the process that
# launched the daemon, while this path stays stable. This is one press and
# one verb, so the Hyprland release defect above cannot affect it.
#
# bind = ALT, A, exec, chibipop ctl anki-add

# Hands-free reading: toggle freezes at toggle-on and stays frozen -
# popup follows the cursor over that frozen screen - until you toggle
# off. One bind, no held key - and therefore the one binding Hyprland's
# release-matching defect can never wedge.
#
# bind = ALT SHIFT, F, exec, chibipop ctl toggle

# Draw the box the Static Anki sentence mode reads from: one press, one
# verb, no release bind. Unlike the trigger and the add, this action has
# no GlobalShortcuts portal id at all. The portal shortcut id set is
# frozen at exactly two, `trigger` and `anki-add`, so the consent dialog
# stays at two entries and a compositor bind is the *only* way to reach
# it. There is no default chord to mirror - pick one
# and set `anki.static_region_key_linux` to the same thing so the
# settings window copies a bind that matches this line.
#
# bind = ALT, R, exec, chibipop ctl static-region

# Grab a region and file it as the mining picture for the popup on
# screen: one press, one verb, no release bind. Native channel only for
# the same reason as the line above - no portal id exists for it. The
# picture that rides an *add* needs no bind at all; it is the *Anki*
# tab's "Include screenshot when adding" checkbox. There is no default
# chord to mirror - pick one and set `actions.screenshot.hotkey_linux`
# to the same thing so the settings window copies a matching bind.
#
# bind = SUPER, S, exec, chibipop ctl screenshot

# Optional: hide the popup from screen sharing.
# layerrule = no_screen_share, chibipop
