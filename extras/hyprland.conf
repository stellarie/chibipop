# Start chibipop on bare Hyprland.
# Do not also enable XDG Autostart.
exec-once = chibipop run

# Copy Bind IDs from Settings > Shortcuts.
# These IDs match docs/REFERENCE.md.

# Set this Bind to Hold in Settings.
# Release F2 before ALT.
# bind = ALT, F2, exec, chibipop ctl bind-down bilingual
# bindr = ALT, F2, exec, chibipop ctl bind-up bilingual

# Set this Bind to Press or Toggle.
# bind = ALT, F3, exec, chibipop ctl bind-down monolingual

# Search uses its configured profile.
# bind = ALT, F6, exec, chibipop ctl bind-down search-monolingual

# Copy action Bind IDs from Settings.
# Anki add uses the displayed Card's profile.
# bind = ALT, A, exec, chibipop ctl bind-down anki-add

# Static region edits the active profile.
# bind = ALT, R, exec, chibipop ctl bind-down static-region

# Include screenshot needs no separate Bind.

# Exclude the popup from screen sharing.
# layerrule = no_screen_share, chibipop
