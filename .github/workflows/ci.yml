name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bless:
        description: >-
          Rewrite the geometry goldens (CHIBIPOP_BLESS=1) and upload them as
          an artifact for review instead of running the tier 0 gate. Never
          commits anything (ADR-0011).
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  tier0:
    # docs/REGRESSION.md tier 0, lifted as-is. Windows is not a preference:
    # the crate is Win32, WinRT OCR and Direct2D throughout and does not
    # build anywhere else.
    #
    # Pinned to windows-2025, not windows-latest, per ADR-0011: the geometry
    # goldens assert exact DirectWrite metrics, so the runner image (its font
    # files) is part of tier0's baseline, like the clippy count and the test
    # floor. A label migration changing fonts would red the gate for no code
    # change. Image EOL is one scheduled re-baseline: bless on the new image,
    # review, and commit stating re-baseline vs finding.
    name: Tier 0 gate
    runs-on: windows-2025
    # A bless dispatch replaces the gate run: blessing exists precisely
    # because the goldens (or the image) changed, so verifying against the
    # old ones in the same run would only red for the reason being fixed.
    if: github.event.inputs.bless != 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Runs three times on purpose. Cargo runs tests in parallel threads of
      # one process, and the wheel accumulator's process-global statics
      # produced an intermittent red once that a single run missed
      # (docs/REGRESSION.md tier 0).
      #
      # --exclude chibipop-linux: both bin crates deliberately produce a
      # binary named `chibipop` (ADR-0001), and cargo uplifts every bin to
      # target/debug/chibipop - one link-producing invocation spanning both
      # bin crates races two linkers over one output path. Check-shaped
      # commands (clippy below) are collision-free and stay --workspace;
      # test/build exclude the foreign bin crate instead. The Linux crate's
      # own gates are the `linux` job's. See the workspace Cargo.toml.
      - name: Tests, three times
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "--- run $i ---"
            cargo test --workspace --exclude chibipop-linux 2>&1 | tee "test-$i.log"
          done
          n=$(awk '/^test result: ok\./ {s+=$4} END {print s+0}' test-3.log)
          echo "passing tests: $n"
          # A floor, not equality: adding a test must not break CI, but a
          # whole target silently not running must.
          if [ "$n" -lt 400 ]; then
            echo "::error::expected at least 400 passing tests, got $n"
            exit 1
          fi

      # --color never is not cosmetic: CARGO_TERM_COLOR is `always` above, so
      # cargo prefixes every diagnostic with an ANSI escape and `^error` never
      # matches. That silently counted 0 and this gate had never once run.
      #
      # The repo carries three accepted clippy findings. CI must assert the
      # COUNT is 3 - a fourth is a real regression. Counting every rendered
      # warning (minus cargo's per-target "generated N warnings" summaries)
      # instead of matching known lint TEXTS, which is blind to any new lint -
      # that is how a dead-code regression got through on 2026-07-31. See
      # docs/REGRESSION.md.
      #
      # No `-D warnings` here since the workspace split, on purpose. Denying
      # turns the core lib's accepted findings into hard errors, no rmeta is
      # produced, and the dependent chibipop-windows crate never gets linted -
      # its accepted finding would silently vanish from the count (and a
      # per-package run does not help: clippy lints workspace-member
      # dependencies with the same flags). Left as warnings, every target
      # lints, cargo deduplicates repeat diagnostics across targets, and one
      # workspace-wide run renders each finding exactly once. The three:
      # lookup/deconj.rs useless_conversion and lookup/model.rs
      # too_many_arguments in core, ui/render.rs layout_pass
      # too_many_arguments in chibipop-windows.
      #
      # Was 4 until 2026-08-09. The hot-reload branch replaced worker_main's
      # trigger drain, which was the `while_let_loop` site, so the count went
      # down because the code did. This number is a baseline, not a constant:
      # when it moves, say in the commit message whether it is a finding or a
      # re-baseline, and move docs/REGRESSION.md's table with it.
      - name: Clippy - exactly three accepted findings
        shell: bash
        run: |
          raw=$(cargo clippy --workspace --color never --all-targets --all-features 2>&1)
          n=$(printf '%s\n' "$raw" | grep -E "^warning" | grep -vcE "generated [0-9]+ warning" || true)
          echo "accepted clippy findings: $n"
          if [ "$n" -ne 3 ]; then
            printf '%s\n' "$raw"
            echo "::error::expected exactly 3 accepted clippy findings, got $n"
            exit 1
          fi

      - name: Clippy - nothing else, with those suppressed
        shell: bash
        run: |
          set +e
          raw=$(cargo clippy --workspace --color never --all-targets --all-features -- -D warnings \
            -A clippy::while_let_loop -A clippy::doc_lazy_continuation \
            -A clippy::useless_conversion -A clippy::too_many_arguments \
            -A clippy::needless_lifetimes -A clippy::type_complexity 2>&1)
          set -e
          n=$(printf '%s\n' "$raw" | grep -cE "^(error|warning)" || true)
          echo "other clippy findings: $n"
          if [ "$n" -ne 0 ]; then
            printf '%s\n' "$raw"
            echo "::error::expected 0, got $n"
            exit 1
          fi

      - name: Release build
        run: cargo build --release --workspace --exclude chibipop-linux

      # A build anyone can download without cutting a tag.
      - uses: actions/upload-artifact@v4
        with:
          name: chibipop-dev-windows-x64
          path: target/release/chibipop.exe
          if-no-files-found: error

  # ADR-0007: the second native job, mirrored gates, no cross-compilation.
  # Pinned to ubuntu-24.04, not ubuntu-latest, per the rolling
  # oldest-supported-runner policy (the runner's glibc is the release
  # binary's floor; ubuntu-22.04 left the runner fleet in 2026). The gate is
  # compositor-free: the runner has no WAYLAND_DISPLAY, and every
  # integration test that needs one skips without it (ADR-0007) - a
  # headless-sway smoke job stays a later, non-blocking addition.
  linux:
    name: Linux gate
    runs-on: ubuntu-24.04
    if: github.event.inputs.bless != 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Three runs and a floor for the same reasons as tier0; --exclude
      # chibipop-windows for the same bin-name-collision reason tier0
      # excludes chibipop-linux (see the workspace Cargo.toml). The floor
      # is 600: core alone passes ~596, so losing the Linux crate's targets
      # (or core) still reds the gate, while merely adding tests never does.
      - name: Tests, three times
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "--- run $i ---"
            cargo test --workspace --exclude chibipop-windows 2>&1 | tee "test-$i.log"
          done
          n=$(awk '/^test result: ok\./ {s+=$4} END {print s+0}' test-3.log)
          echo "passing tests: $n"
          if [ "$n" -lt 600 ]; then
            echo "::error::expected at least 600 passing tests, got $n"
            exit 1
          fi

      # ADR-0009's OCR quality gate: the committed 152-crop benchmark corpus
      # through the ported meikiocr pipeline, asserting the ADR's floors
      # (horizontal CER <= 5 % / hit-scan >= 90 %, vertical CER <= 20 % /
      # hit-scan >= 75 %) and +-3 pp parity with the Python harness's 1x
      # numbers. Deliberately outside the x3 loop above and marked
      # `test = false` in the crate manifest: that loop exists to catch
      # process-global state racing between parallel tests, and this target
      # has none - it reads committed files and committed models and answers
      # the same thing every time, so repeating it only spends runner time on
      # the slowest target in the tree. CPU-only; ONNX Runtime arrives as
      # `ort`'s pinned prebuilt download, so there is nothing to apt-install.
      # `--nocapture` puts the measured-vs-reference table in the log, which
      # is what the next regression gets read against.
      - name: OCR quality gate
        run: cargo test -p chibipop-linux --test ocr_gate -- --nocapture

      # Same warning-count mechanics as tier0 (see the long comment there;
      # --color never is load-bearing). The count is per-platform after the
      # workspace split (ADR-0007): on Linux the windows crate cfg-stubs to
      # nothing, so its render.rs finding does not exist here and the
      # baseline is core's two - lookup/deconj.rs useless_conversion and
      # lookup/model.rs too_many_arguments. The Linux crate's accepted
      # count is zero and must stay zero.
      - name: Clippy - exactly two accepted findings
        shell: bash
        run: |
          raw=$(cargo clippy --workspace --color never --all-targets --all-features 2>&1)
          n=$(printf '%s\n' "$raw" | grep -E "^warning" | grep -vcE "generated [0-9]+ warning" || true)
          echo "accepted clippy findings: $n"
          if [ "$n" -ne 2 ]; then
            printf '%s\n' "$raw"
            echo "::error::expected exactly 2 accepted clippy findings, got $n"
            exit 1
          fi

      - name: Clippy - nothing else, with those suppressed
        shell: bash
        run: |
          set +e
          raw=$(cargo clippy --workspace --color never --all-targets --all-features -- -D warnings \
            -A clippy::while_let_loop -A clippy::doc_lazy_continuation \
            -A clippy::useless_conversion -A clippy::too_many_arguments \
            -A clippy::needless_lifetimes -A clippy::type_complexity 2>&1)
          set -e
          n=$(printf '%s\n' "$raw" | grep -cE "^(error|warning)" || true)
          echo "other clippy findings: $n"
          if [ "$n" -ne 0 ]; then
            printf '%s\n' "$raw"
            echo "::error::expected 0, got $n"
            exit 1
          fi

      - name: Release build
        run: cargo build --release --workspace --exclude chibipop-windows

      # A build anyone can download without cutting a tag.
      - uses: actions/upload-artifact@v4
        with:
          name: chibipop-dev-linux-x64
          path: target/release/chibipop
          if-no-files-found: error

  # ADR-0011 bless mechanics: workflow_dispatch with bless=true reruns the
  # golden tests with CHIBIPOP_BLESS=1, which rewrites the goldens instead of
  # comparing, and uploads the result for a human to review and commit. CI
  # holds no push credentials and this job must never gain any: the artifact
  # is the only output. Same image pin as tier0 — a golden blessed on a
  # different image would be wrong by construction.
  bless-geometry-goldens:
    name: Bless geometry goldens
    runs-on: windows-2025
    if: github.event.inputs.bless == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Rewrite goldens
        shell: bash
        env:
          CHIBIPOP_BLESS: "1"
        run: cargo test -p chibipop-windows --test geometry_goldens -- --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: geometry-goldens
          path: crates/chibipop-windows/tests/goldens/geometry
          if-no-files-found: error
