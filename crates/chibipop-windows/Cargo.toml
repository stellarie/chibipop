[package]
name = "chibipop-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

# The binary keeps its name. A Windows user notices nothing about the
# workspace split: same chibipop.exe, same behavior, same config file.
[[bin]]
name = "chibipop"
path = "src/main.rs"

[dependencies]
chibipop = { path = "../.." }
anyhow.workspace = true
clap.workspace = true
rusqlite.workspace = true
serde_json.workspace = true

# Win32-only, resolved only when actually compiling for Windows so the
# cfg-stubbed foreign-target build (see src/main.rs) pulls none of it and
# `cargo test --workspace` works on the Linux CI runner (ADR-0007).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_System_WinRT",
  "Media_Ocr",
  "Graphics_Imaging",
  "Globalization",
  "Storage_Streams",
  "Security_Cryptography",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_System_LibraryLoader",
  # CreateMutexW takes SECURITY_ATTRIBUTES.
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Console",
] }
windows-future = "0.3.2"
# Only for `Vector2`, the origin type `ID2D1RenderTarget::DrawTextLayout`
# requires (render.rs, M3 Task 5). Already resolved at this exact version as
# a transitive dependency of `windows` itself (see Cargo.lock) - naming it
# directly here does not change what gets built, only what render.rs is
# allowed to import by name.
windows-numerics = "0.3.1"
