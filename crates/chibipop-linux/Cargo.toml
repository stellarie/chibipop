[package]
name = "chibipop-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

# The binary keeps its name, exactly like the Windows crate: a Linux user
# types `chibipop`, and the release tarball ships it as such (ADR-0007).
[[bin]]
name = "chibipop"
path = "src/main.rs"

# The OCR engine is the one piece of this adapter with a standing fixture
# gate (ADR-0009), and cargo cannot link an integration test against a bin
# target - so the adapter grows a thin lib face carrying exactly that
# module. The bin stays the product; the lib exists for `tests/`.
[lib]
name = "chibipop_linux"
path = "src/lib.rs"

# ADR-0009's two distribution paths, one feature each. The default fetches
# a pinned ONNX Runtime at build time and ships it beside the binary, which
# is what the release tarball and `chibipop-bin` want and what lets CI run
# with no apt package. `--no-default-features --features system-onnxruntime`
# is the source-AUR path: `ort` dlopens the distro's `libonnxruntime.so` at
# runtime and nothing is downloaded or linked at build time. Enabling both
# (as `--all-features` does) is harmless - dynamic loading wins and the
# download is skipped.
[features]
default = ["bundled-onnxruntime"]
bundled-onnxruntime = ["ort/download-binaries", "ort/tls-rustls"]
system-onnxruntime = ["ort/load-dynamic"]

[dependencies]
chibipop = { path = "../.." }
anyhow.workspace = true
clap.workspace = true

# Wayland/calloop only when actually compiling for Linux, mirroring the
# Windows crate's cfg-stub arrangement: on a foreign target this bin is a
# two-line refusal (src/main.rs) and pulls none of the platform stack, so
# `cargo test --workspace` stays one command on both CI runners.
[target.'cfg(target_os = "linux")'.dependencies]
calloop = { workspace = true, features = ["signals"] }
calloop-wayland-source.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
# The `chibipop settings` window (ADR-0005): iced 0.14 on a plain
# xdg_toplevel, in this transient process only — the daemon never links it.
iced.workspace = true
fontdb.workspace = true
# The meikiocr port (ADR-0009): three ONNX sessions, plus the digest check
# over their bundled files.
ort.workspace = true
sha2.workspace = true

# The OCR fixture gate reads the committed corpus; nothing in the shipped
# adapter decodes PNG or needs a Unicode normalisation table.
[target.'cfg(target_os = "linux")'.dev-dependencies]
png.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
