[package]
name = "chibipop"
version = "0.1.0"
edition = "2021"

[lib]
name = "chibipop"
path = "src/lib.rs"

[[bin]]
name = "chibipop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_WinRT", "Media_Ocr", "Graphics_Imaging", "Globalization", "Storage_Streams", "Security_Cryptography", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
windows-future = "0.3.2"
