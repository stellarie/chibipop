[workspace]
# The workspace shape (see ARCHITECTURE.md#workspace-and-seams): core
# lib `chibipop` (this package, at the repo root so `use chibipop::…`
# and the `data/` + `tests/fixtures/` paths it resolves against are
# untouched by the split) plus one bin crate per platform.
# `chibipop-linux` joins as a sibling.
members = ["crates/chibipop-windows", "crates/chibipop-linux"]
# Both bins are deliberately named `chibipop`, and cargo uplifts
# every bin to target/<profile>/chibipop - so any single link-producing
# invocation (test/build/run) that spans BOTH bin crates races two linkers
# over one output path and fails. Check-shaped commands (`cargo check`,
# `cargo clippy`) link nothing and are collision-free, which is why each bin
# still cfg-stubs to a refusal `main` on foreign targets (see the bins'
# main.rs, platform deps under [target.'cfg(...)'.dependencies]): one
# `cargo clippy --workspace` lints every member on both CI runners.
# Test/build therefore exclude the foreign bin crate instead:
#   Windows tier0:  cargo test --workspace --exclude chibipop-linux
#   Linux job:      cargo test --workspace --exclude chibipop-windows
# default-members makes the bare commands serve the dev box: this project
# is developed on Linux and Windows is CI-verified (tier0), so bare
# `cargo test` covers core + the Linux bin; per-crate work uses `-p`.
default-members = [".", "crates/chibipop-linux"]
resolver = "2"

# A `cargo run` build imports dictionaries about eight times slower than a
# release one, and an import is the one thing in this tree that is purely
# compute-bound: serde_json's tokenizer, the glossary parser, SQLite's own
# C, miniz's inflate. Unoptimised, jitendex takes 56 seconds; with these two
# lines it takes 4, and a release build takes 1.5.
#
# `opt-level = 1` on this workspace's own crates keeps debug builds
# debuggable and their compiles quick; `opt-level = 3` on every dependency
# costs nothing after the first build, because a dependency is compiled once
# and then cached.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.package]
# 0.7.2 is deliberately never tagged: its headline feature was the
# rebuild-and-promote path, and that path deadlocks on JoinHandle::join.
# 0.8.0 deletes it. See docs/REGRESSION.md and docs/BACKLOG.md.
version = "0.9.9"
edition = "2021"
license = "GPL-3.0-or-later"

# One pin per dependency for the whole workspace: two crates disagreeing on
# a version is how a "pure move" stops being one.
[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.4", features = ["derive"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
# `raw_value`: the dictionary builder stores a glossary verbatim, so it
# captures the archive's own bytes with `RawValue` instead of round-tripping
# them through a `Value` tree and a serializer.
serde_json = { version = "1.0.151", features = ["raw_value"] }
toml = "1.1.3"
ureq = { version = "3", features = ["json"] }
# Vibrato's default `train` feature adds rucrf and 40 crates.
# The dependency declaration disables that feature.
# `Dictionary::read` takes the decoded model without zstd. The v0.5.0 release
# notes confirm that this model loads with version 0.5.2.
vibrato = { version = "=0.5.2", default-features = false }
# UAX #29 provides graphemes and word boundaries.
# The application uses its word boundaries as the fallback for non-Japanese text.
# UAX #29 alone splits every ideograph and hiragana code point, so Vibrato
# provides Japanese morphology for glossary word selection.
unicode-segmentation = "=1.13.3"

zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Linux bin only; listed here to keep the one-pin rule.
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
# wlr-screencopy (the primary capture rung, see
# ARCHITECTURE.md#capture-and-masking): the only protocol with
# compositor-side region capture. Same wayland-rs generation as the pin above.
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# The popup's own stack: SCTK 0.21 drives the
# wlr-layer surface and the `wl_shm` SlotPool behind it, tiny-skia
# rasters the panel, cosmic-text shapes and rasterizes text with locale
# `ja` (Han unification: kanji must be JP variants). No GPU context -
# all three are resident in the daemon. cosmic-text carries its own
# fontdb, so the JP-family probe asks the popup's own `FontSystem` and
# binds no second font stack. iced pulls an older cosmic-text of its
# own; that copy serves the settings process only and this pin is the
# one the daemon paints with.
#
# `default-features = false`: SCTK's default `xkbcommon` feature links
# the system libxkbcommon through pkg-config, and this popup has no
# keyboard by construction (`keyboard_interactivity: none`),
# so the dependency would buy nothing and cost a build-time system
# package on every CI runner and packaging target. Its `calloop` feature
# stays off with it: the daemon owns the loop and already drives the
# Wayland queue through `calloop-wayland-source`.
smithay-client-toolkit = { version = "0.21.1", default-features = false }
tiny-skia = "0.12.0"
cosmic-text = "0.19.0"
# The settings window's toolkit (ARCHITECTURE.md#settings-and-config):
# a separate `chibipop settings` process, so none of this is resident
# in the daemon.
iced = "0.14.0"
# Font-family enumeration for the settings font combo; the same fontdb
# iced already carries via cosmic-text, so no second font stack.
fontdb = "0.23"
# The Linux OCR engine (ARCHITECTURE.md#ocr-engine): meikiocr's three
# ONNX models driven by ONNX Runtime. `ndarray` and `tracing` stay off -
# outputs are read as flat slices and the daemon already owns its stderr
# log. The two distribution paths are cargo features on chibipop-linux,
# not settings here: the default downloads a pinned prebuilt runtime at
# build time (the release tarball, and the only thing that makes
# `cargo test` work on a bare ubuntu runner), the source-AUR path dlopens
# the system library.
# Exact-pinned: an rc line reserves the right to move its API under us.
# No `api-N` feature on purpose: `ort` then asks the backend for API 17,
# its floor, which is the one setting under which both distribution paths
# work - the pinned 1.28 download and a distro `libonnxruntime` as old as
# 1.17 (Arch ships 1.24). Nothing here reaches past that API.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "copy-dylibs"] }
# Verifies the bundled model files against their committed digests before
# a session is built: hash-pinned, with no first-run download.
sha2 = "0.10.9"
# The SNI tray (ARCHITECTURE.md#platform-integration): ksni runs its own
# D-Bus thread. `async-io`, not the default `tokio` feature — the
# sync/calloop daemon must not import a second async runtime, and ksni's
# feature unification would.
# `blocking` is only a sync wrapper over that runtime: the daemon thread
# gets a Handle it can update without hosting an executor.
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
# Decodes the embedded tray PNGs into the ARGB32 pixmaps SNI asks for (the
# `.ico` frame parser stays Windows-only); the OCR fixture gate
# also decodes the committed corpus PNGs in tests.
png = "0.18.1"
# Test-only: the OCR gate mirrors the benchmark harness's NFKC step when it
# scores a prediction (tools/ocr-bench/bench/common.py normalise()).
unicode-normalization = "0.1.24"
# The POSIX signal mask: the daemon blocks SIGINT/SIGTERM for
# every thread and hands the default disposition back to every child it
# execs. `calloop`'s `signals` feature already resolves exactly this
# version - its `Signal` enum is its own, so the mask itself has to come
# from here - and its `signal` feature is the one calloop enables, so the
# one-pin rule costs no new package and no new feature in the lockfile.
nix = { version = "0.31.3", default-features = false, features = ["signal"] }

# --- portal ScreenCast capture backend (capture rung 2) ---
# The portal handshake is D-Bus, and zbus is already in this tree: ksni's
# `async-io` feature resolves exactly this version, so the one-pin rule
# costs nothing new and the daemon still hosts no executor of its own -
# `zbus::blocking` (the default `blocking-api`) is called from the portal's
# own thread. Default features deliberately: they are `async-io` +
# `blocking-api`, the same pair ksni already unifies to. Naming `tokio`
# here would pull a second runtime into the daemon, which its sync/calloop
# design forbids.
zbus = "5.19.0"
# PipeWire is dlopened, never linked: `libpipewire-0.3.so.0` at runtime, no
# `libpipewire-0.3-dev` at build time. The same bargain `ort`'s system
# path already strikes, and it is what keeps one `cargo test --workspace`
# green on a runner with no PipeWire pkg-config file. `ort` already resolves
# this exact version, so the lockfile gains no package.
libloading = "0.9.0"

# --- paint-time decoders (`dict::media::decode`) ---
# One rasterizer per census format, reachable from nothing else. They run
# in the bin behind its own surface cache and never on the measurement
# path: the media row records intrinsic sizes at build time
# precisely so that a decoder is not an input to layout, and `decode`
# takes the format the row already recorded rather than sniffing again.
#
# resvg is the one that carries the gaiji. 35 of this library's 236 assets
# are HanaMin glyph outlines at `height: 1em, appearance: monochrome`, so
# it is also the only decoder `Tint::Raster` can rasterize a
# mask with - a vector has no pixels until something picks a size, which
# is the whole reason that variant carries one. It resolves tiny-skia
# 0.12.0, the exact pin the popup panel above already paints with, so the
# one-pin rule costs no second copy of the rasterizer; and a `Pixmap` is
# premultiplied RGBA8, which is `dict::media::Surface`'s own layout, so
# the handoff copies nothing. `default-features = false` drops four
# things this build must not have: `text` and `system-fonts` link fontdb
# and libfontconfig - the same build-time system package the SCTK pin
# above refuses - and no census SVG carries a `<text>` element; `svgz` is
# unreachable because `sniff` claims only plaintext `<svg`; and
# `raster-images` would bury a second JPEG and GIF decoder inside resvg
# for `<image>` elements no census SVG uses.
resvg = { version = "0.48.1", default-features = false }
# JPEG and GIF: the census found both, this library ships neither, so
# they are cheap completeness rather than load-bearing. `zune-jpeg` over
# `jpeg-decoder` because the latter's default `rayon` feature would put a
# thread pool in the daemon, which its sync design forbids, and its no-rayon
# path is the slower of the two. It re-exports its own `zune-core`, so
# naming the colourspace costs no second pin. An animated GIF renders its
# first frame composited into the logical screen the media row recorded,
# which is what `probe` already documents that column as meaning.
zune-jpeg = "0.5"
gif = "0.14.2"
# AVIF: 201 of this library's 236 assets and the awkward format,
# because sizing one needs no decoder and painting one needs a whole AV1
# implementation. Every C route was refused on the build it would cost:
# `libavif-sys` and `libdav1d-sys` build their codec with meson, ninja and
# nasm, and `dav1d-rs` links a system libdav1d through pkg-config - none
# of which either CI runner installs, and the Windows gate has no
# libdav1d at all. That leaves two pure-Rust decoders, and the choice
# between them is a safety argument, not a correctness one. `rav1d`, the
# dav1d port, decodes all 201 assets bit-exactly - and publishes only its
# `extern "C"` dav1d API, so its own `Option::unwrap` on a malformed
# frame (rav1d 1.1.0 decode.rs:4997, reachable by flipping one byte of a
# real Jitendex asset) crosses an ABI that cannot unwind and *aborts the
# process*. A dictionary archive is third-party bytes and the ladder's
# promise is `alt` text, so that is disqualifying. `avif-rust` is safe
# Rust throughout, survives 11 574 truncations and single-byte
# corruptions of real assets without one panic, and matches libavif to
# within one level on 198 of 201. The residue is named in the decoder
# comments and lands on the `alt` ladder, not on a crash.
avif-rust = "0.0.6"

[package]
name = "chibipop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "chibipop"
path = "src/lib.rs"

# No `windows` here, and none arriving by cfg either: the platform crates
# are named only by the bins. This crate builds on stable Linux.
[dependencies]
anyhow.workspace = true
# The `vibrato` dependency provides Japanese morphology for glossary word selection.
vibrato.workspace = true
# The `unicode-segmentation` dependency provides graphemes and word boundaries.
unicode-segmentation.workspace = true
# Japanese analysis uses `sha2` to make sure that the bundled IPADIC model matches its
# digest before use.
sha2.workspace = true
# The Anki picture payload: AnkiConnect takes attachments as base64.
base64.workspace = true
# The one PNG encoder (src/image.rs) and the first of
# `dict::media::decode`'s five rasterizers. Pure Rust, so it costs the
# Windows bin nothing and it is the same version the Linux bin already
# decodes its tray icons with.
png.workspace = true
# The other four (`dict::media::decode`). Every one is pure
# Rust, so both bins keep the C-free build they have today - the only
# native code in this tree stays rusqlite's bundled SQLite. resvg brings
# tiny-skia into this crate, and therefore into the Windows bin, which is
# what makes an SVG gaiji paint on both platforms from one rasterizer
# instead of two.
resvg.workspace = true
zune-jpeg.workspace = true
gif.workspace = true
avif-rust.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq.workspace = true
zip.workspace = true
