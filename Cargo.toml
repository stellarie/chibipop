[workspace]
# ADR-0001: core lib `chibipop` (this package, at the repo root so
# `use chibipop::…` and the `data/` + `tests/fixtures/` paths it resolves
# against are untouched by the split) plus one bin crate per platform.
# `chibipop-linux` joins as a sibling.
members = ["crates/chibipop-windows"]
# Without this a hybrid root builds only the root package, so a bare
# `cargo test` would silently stop covering the Windows crate - exactly the
# "whole target not running" failure tier0's test floor exists to catch.
# On Linux the Windows member fails to compile, loudly; use `-p chibipop`.
default-members = [".", "crates/chibipop-windows"]
resolver = "2"

[workspace.package]
# 0.7.2 is deliberately never tagged: its headline feature was the
# rebuild-and-promote path, and that path deadlocks on JoinHandle::join.
# 0.8.0 deletes it. See docs/REGRESSION.md and docs/BACKLOG.md.
version = "0.8.2"
edition = "2021"
license = "GPL-3.0-or-later"

# One pin per dependency for the whole workspace: two crates disagreeing on
# a version is how a "pure move" stops being one.
[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
ureq = { version = "3", features = ["json"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[package]
name = "chibipop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "chibipop"
path = "src/lib.rs"

# No `windows` here, and none arriving by cfg either: the platform crates
# are named only by the bins (ADR-0001). This crate builds on stable Linux.
[dependencies]
anyhow.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq.workspace = true
zip.workspace = true
